databases:
  - name: sternen-postgres
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: sternen-api
    runtime: docker
    dockerfilePath: docker/api.Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: sternen-postgres
          property: connectionString
      - key: BUSINESS_TIME_ZONE
        value: Europe/Zurich
      # Set the remaining required variables (FRONTEND_URL, ALLOWED_ORIGINS,
      # SESSION_SECRET, RESTAURANT_NOTIFICATION_EMAIL, SMTP_*, ACTION_LINK_BASE_URL,
      # POS_API_KEY_PEPPER, TOKEN_HASH_PEPPER) in the Render dashboard —
      # see apps/api/.env.example. They are intentionally not hard-coded here.
